name: Fork images

on:
  push:
    branches: [fork/images]

permissions:
  contents: read

concurrency:
  group: fork-images
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'zeflash/nanobot' && github.ref == 'refs/heads/fork/images'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zeflash/nanobot
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install test dependencies
        run: |
          uv sync --extra dev
          uv run --no-sync python -m scripts.install_channel_dependencies slack
          uv pip check
      - name: Validate selected corrections and channel contracts
        run: |
          uv run --no-sync ruff check nanobot/agent/tools/shell.py tests/tools/test_exec_runtime_schema.py tests/tools/test_tool_descriptions.py .github/scripts/fork_image_smoke.py
          uv run --no-sync python -m scripts.check_import_boundaries
          uv run --no-sync python -m pytest -p no:cacheprovider -q \
            tests/tools/test_exec_runtime_schema.py \
            tests/tools/test_exec_session_tools.py \
            tests/tools/test_exec_session_timeout.py \
            tests/tools/test_exec_session_startup.py \
            tests/tools/test_exec_session_capacity.py \
            tests/tools/test_shell_execution_budgets.py \
            tests/tools/test_shell_output.py \
            tests/tools/test_shell_reap.py \
            tests/tools/test_tool_registry.py \
            tests/tools/test_tool_descriptions.py \
            tests/test_docker_config.py \
            tests/test_docker_smoke.py \
            nanobot/channels/slack/tests/test_slack_channel.py \
            nanobot/channels/websocket/tests/test_handshake_disconnect.py \
            nanobot/channels/websocket/tests/test_binary_http.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nanobot-fork:${{ github.sha }}
          build-args: |
            NANOBOT_CHANNELS=slack,websocket
          labels: |
            org.opencontainers.image.source=https://github.com/zeflash/nanobot
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
      - name: Verify built image without external access
        shell: bash
        run: |
          set -euo pipefail
          candidate="nanobot-fork:$GITHUB_SHA"
          test "$(docker image inspect "$candidate" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$candidate" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          expected="$(sha256sum nanobot/agent/tools/shell.py | cut -d ' ' -f 1)"
          docker run --rm -i --network none --user 1000:1000 --workdir /tmp \
            --entrypoint python -e EXPECTED_SHELL_SHA="$expected" \
            "$candidate" -B - < .github/scripts/fork_image_smoke.py
      - name: Authenticate to GHCR after validation
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          target="$IMAGE:sha-$GITHUB_SHA"
          docker tag "nanobot-fork:$GITHUB_SHA" "$target"
          docker push "$target" | tee "$RUNNER_TEMP/fork-image-push.log"
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "$RUNNER_TEMP/fork-image-push.log" | tail -n 1)"
          test "${#digest}" = 71
          docker buildx imagetools inspect "$target" --raw > "$RUNNER_TEMP/fork-image-manifest.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/fork-image-manifest.json" | cut -d ' ' -f 1)" = "$digest"
          {
            echo '## Tested candidate — not deployed'
            echo "Source: $GITHUB_SHA"
            echo "Image: \`$IMAGE@$digest\`"
            echo 'Platform: linux/amd64; channels: Slack, WebSocket'
            echo 'No production credentials, data, or deployment access used.'
          } >> "$GITHUB_STEP_SUMMARY"
